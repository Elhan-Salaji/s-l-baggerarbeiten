# Liefert den Vite-Build aus. TLS und Security-Header übernimmt Caddy
# davor, hier geht es nur um Auslieferung und Caching.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite-Bundles tragen einen Hash im Namen und ändern sich nie.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bilder, Logos und Schriften ändern sich selten.
    location ~ ^/(img|logo|fonts)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA: unbekannte Pfade rendert die Anwendung (Impressum, Datenschutz).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
